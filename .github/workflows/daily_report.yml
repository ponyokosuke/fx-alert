name: 毎朝の定期確認（月〜土 7:30 JST）

on:
  schedule:
    # 7:30 JST = 前日22:30 UTC。日曜22:30〜金曜22:30(UTC)に実行 = JSTの月〜土 7:30
    - cron: "30 22 * * 0-5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 定期確認レポートを送信
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python fx_commodity_alert.py --daily-report
